<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tabela de Ninjas</title>
    <link rel="stylesheet" th:href="@{/css/listar-ninjas.css}">
</head>
<body>
    <main class="page-container">
        <!-- #P95 34 - Introdução ao Thymeleaf [Aula Extra] -->
        <section class="ninja-card">
            <header class="page-header">
                <div>
                    <p class="eyebrow">Cadastro de ninjas</p>
                    <h1>Lista de Ninjas</h1>
                    <p class="subtitle">Gerencie os ninjas e acompanhe suas missões.</p>
                </div>
                <div class="header-actions">
                    <span class="ninja-count" th:text="|${#lists.size(ninjas)} ninjas cadastrados|">Ninjas cadastrados</span>
                    <a class="add-ninja" th:href="@{/ninjas/ui/adicionar}">+ Adicionar ninja</a>
                </div>
            </header>
            <p class="feedback-message" th:if="${mensagem}" th:text="${mensagem}"></p>
            <div class="table-wrapper">
                <table>
        <thead>
            <tr>
                <th>Id</th>
                <th>Imagem</th>
                <th>Nome</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Rank</th>
                <th>Missões</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="ninja : ${ninjas}">
                <td class="id-cell" th:text="${ninja.id}"></td>
                <td><img class="ninja-avatar" th:src="${ninja.imgUrl}" width="100" height="100" alt="Imagem do ninja"></td>
                <td class="name-cell" th:text="${ninja.nome}"></td>
                <td th:text="${ninja.idade}"></td>
                <td th:text="${ninja.email}"></td>
                <td><span class="rank-badge" th:text="${ninja.rank}"></span></td>
                <td class="mission-cell">
                    <span th:if="${ninja.missoes}"> Missão: <span th:text="${ninja.missoes.nome}"></span>, Dificuldade: <span th:text="${ninja.missoes.dificuldade}"></span></span>
                    <span th:if="${ninja.missoes == null}"> Sem Missões cadastradas para o ninja</span>
                </td>

                <td>
                    <div class="actions">
                        <a class="action-link details" th:href="@{/ninjas/ui/detalhes/{id}(id=${ninja.id})}">Ver detalhes</a>
                        <a class="action-link edit" th:href="@{/ninjas/ui/alterar/{id}(id=${ninja.id})}">Editar</a>
                        <a class="action-link delete" th:href="@{/ninjas/ui/deletar/{id}(id=${ninja.id})}">Deletar</a>
                    </div>
                </td>
            </tr>
        </tbody>
                </table>
            </div>
        </section>
    </main>
</body>
</html>
